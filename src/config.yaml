
  # config.yaml

  # -------------------------------------------------------------------
  # Input and output paths
  # -------------------------------------------------------------------

  # Directory containing all input images.
  input_img_dir: "../data/undistorted"

  # Camera extrinsic calibration file.
  camera_extrinsic_path: "../data/tuned_camera_lidar_extrinsic.json"

  # Camera intrinsic calibration file.
  camera_intrinsic_path: "../data/intrinsics.txt"

  # Camera timetsamp path 
  camera_timestamp_path: "../data/timestamps.txt"

  # Directory containing projected z-buffer (.npy) files.
  projective_z_buffer_dir: "../data/lidar_z_buffer_window_merged"

  # Output file containing optimized camera poses.
  output_path: "../data/output_optimized_camera.txt"

  # Directory containing LiDAR point cloud (.ply) files.
  lidar_ply_dirs: "../data"

  # LiDAR pose file.
  lidar_kf_path: "../data/key_frames.jsonl"


  # -------------------------------------------------------------------
  # SIFT feature extraction
  # -------------------------------------------------------------------

  # Maximum number of retained features.
  # Use 0 to let OpenCV retain all detected features.
  sift_nfeatures: 0

  # Number of layers in each octave.
  sift_n_octave_layers: 3

  # Larger values keep only stronger features.
  sift_contrast_threshold: 0.04

  # Larger values retain more edge-like features.
  sift_edge_threshold: 10.0

  # Gaussian blur sigma at the first octave.
  sift_sigma: 1.6


  # -------------------------------------------------------------------
  # Feature matching and geometric verification
  # -------------------------------------------------------------------

  # Lowe ratio-test threshold.
  ratio_threshold: 0.8

  # RANSAC pixel threshold used when estimating the fundamental matrix.
  ransac_threshold: 2.0

  # Minimum number of geometrically verified matches required for an image pair.
  min_inliers: 8

  # Absolute cap on descriptor L2 distance for a match (applied in addition
  # to the Lowe ratio test above). Lower values reject weaker matches and
  # improve accuracy at the cost of fewer matches. Use -1 to disable.
  sift_max_match_distance: 450


  num_iteration: 10


  # Landmark filtering: after triangulating a landmark's world position,
  # observations whose reprojection error exceeds this many pixels are
  # dropped (and the landmark itself is dropped if too few observations
  # remain).
  landmark_reprojection_error_threshold: 8.0

  # Limit how many images (from the start of camera_timestamp_path) to
  # process. Use -1 to process all images.
  max_images: 50