
  # config.yaml

  # -------------------------------------------------------------------
  # Input and output paths
  # -------------------------------------------------------------------

  # Directory containing all input images.
  input_img_dir: "/home/chuchu/PycharmProjects/BundleAdjustment/for_chu/undistorted"

  # Camera extrinsic calibration file.
  camera_extrinsic_path: "/home/chuchu/PycharmProjects/BundleAdjustment/for_chu/tuned_camera_lidar_extrinsic.json"

  # Camera intrinsic calibration file.
  camera_intrinsic_path: "/home/chuchu/PycharmProjects/BundleAdjustment/for_chu/camera_intrinsic.npz"

  # Directory containing projected z-buffer (.npy) files.
  projective_z_buffer_dir: "/home/chuchu/PycharmProjects/BundleAdjustment/for_chu/lidar_z_buffer_window_merged"

  # Output file containing optimized camera poses.
  output_path: "./output_optimized_camera.txt"


  # -------------------------------------------------------------------
  # SIFT feature extraction
  # -------------------------------------------------------------------

  # Maximum number of retained features.
  # Use 0 to let OpenCV retain all detected features.
  sift_nfeatures: 0

  # Number of layers in each octave.
  sift_n_octave_layers: 3

  # Larger values keep only stronger features.
  sift_contrast_threshold: 0.04

  # Larger values retain more edge-like features.
  sift_edge_threshold: 10.0

  # Gaussian blur sigma at the first octave.
  sift_sigma: 1.6


  # -------------------------------------------------------------------
  # Feature matching and geometric verification
  # -------------------------------------------------------------------

  # Lowe ratio-test threshold.
  ratio_threshold: 0.75

  # RANSAC pixel threshold used when estimating the fundamental matrix.
  ransac_threshold: 1.0

  # Minimum number of geometrically verified matches required for an image pair.
  min_inliers: 8